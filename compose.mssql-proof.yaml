# Explicit synthetic Linux-x64 stand. No external/production networks, published
# SQL/S3/metadata ports, automatic volume removal or automatic image rebuilds.
# Build api once only after explicit Microsoft terms acceptance and disk checks.
name: steelkeep-mssql-proof

x-proof-logging: &proof_logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

x-proof-labels: &proof_labels
  purpose: steelkeep-mssql-native-proof
  org.steelkeep.proof.nonce: ${STEELKEEP_MSSQL_PROOF_NONCE:?Set a fresh private 64-hex proof nonce}

x-proof-environment: &proof_environment
  DATABASE_URL: postgres://steelkeep:local-metadata-only@metadata:5432/steelkeep_mssql_proof
  STEELKEEP_DATABASE_PASSWORD_FILE: ''
  STEELKEEP_KEY_FILE: /run/steelkeep/key
  STEELKEEP_TOKEN_FILE: /run/steelkeep/token
  STEELKEEP_ALLOWED_HOSTS: mssql-fixture,s3
  STEELKEEP_ALLOWED_ORIGINS: http://127.0.0.1:54391
  STEELKEEP_PUBLIC_HOSTS: api,127.0.0.1,localhost
  STEELKEEP_SECURE_COOKIE: 'false'
  STEELKEEP_DACFX_HELPER: /opt/steelkeep-dacfx/Steelkeep.DacFx.dll
  STEELKEEP_MSSQL_PROOF_NONCE: ${STEELKEEP_MSSQL_PROOF_NONCE:?Set a fresh private 64-hex proof nonce}
  STEELKEEP_MSSQL_PROOF_SQL_HOSTNAME: ${STEELKEEP_MSSQL_PROOF_SQL_HOSTNAME:?Set mssql-proof- followed by the first 12 nonce characters}
  HOST: 0.0.0.0
  PORT: 4311

x-proof-application: &proof_application
  image: steelkeep-mssql-proof:local
  platform: linux/amd64
  pull_policy: never
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
  environment: *proof_environment
  volumes:
    - ./.steelkeep/mssql-proof/key:/run/steelkeep/key:ro
    - ./.steelkeep/mssql-proof/token:/run/steelkeep/token:ro
    - ./.steelkeep/mssql-proof/proof-nonce:/run/steelkeep/proof-nonce:ro
  networks: [proof]
  logging: *proof_logging
  labels: *proof_labels

services:
  metadata:
    image: postgres:17-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: steelkeep
      POSTGRES_PASSWORD: local-metadata-only
      POSTGRES_DB: steelkeep_mssql_proof
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=2MB, -c, max_connections=50]
    volumes: [metadata:/var/lib/postgresql/data]
    networks: [proof]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, pg_isready, -U, steelkeep, -d, steelkeep_mssql_proof]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *proof_logging
    labels: *proof_labels

  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    platform: linux/amd64
    environment:
      RUSTFS_ACCESS_KEY: steelkeep-local
      RUSTFS_SECRET_KEY: local-s3-fixture-only
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes: [artifacts:/data]
    networks: [proof]
    mem_limit: 512m
    cpus: 0.5
    logging: *proof_logging
    labels: *proof_labels

  mssql-fixture:
    image: mcr.microsoft.com/mssql/server:2022-CU23-ubuntu-22.04
    platform: linux/amd64
    hostname: ${STEELKEEP_MSSQL_PROOF_SQL_HOSTNAME:?Set mssql-proof- followed by the first 12 nonce characters}
    environment:
      ACCEPT_EULA: ${STEELKEEP_MSSQL_ACCEPT_EULA:?Operator must explicitly accept applicable Microsoft terms first}
      MSSQL_SA_PASSWORD: ${STEELKEEP_MSSQL_SA_PASSWORD:?Set the private synthetic SA password matching its secret file}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: '2048'
    volumes: [sql-data:/var/opt/mssql]
    networks: [proof]
    mem_limit: 3g
    cpus: 1
    stop_grace_period: 1m
    # Readiness is established by the bounded SQL driver probe, without a
    # credential-bearing sqlcmd healthcheck or public 1433/54380 binding.
    logging: *proof_logging
    labels: *proof_labels

  migrate:
    <<: *proof_application
    command: [bun, server/migrate.ts]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      metadata: {condition: service_healthy}

  api:
    <<: *proof_application
    build:
      context: .
      dockerfile: Dockerfile.mssql-proof
      args:
        STEELKEEP_MSSQL_ACCEPT_EULA: ${STEELKEEP_MSSQL_ACCEPT_EULA:?Operator must explicitly accept applicable Microsoft terms first}
    command: [bun, server/index.ts]
    ports: ["127.0.0.1:54391:4311"]
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:4311/api/v1/health');if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 5s
      retries: 30

  worker:
    <<: *proof_application
    command: [bun, server/worker.ts]
    tmpfs: []
    volumes:
      - ./.steelkeep/mssql-proof/key:/run/steelkeep/key:ro
      - ./.steelkeep/mssql-proof/token:/run/steelkeep/token:ro
      - ./.steelkeep/mssql-proof/proof-nonce:/run/steelkeep/proof-nonce:ro
      # Disk-backed scratch preserves archive free-space checks without
      # reserving >2 GiB RAM or sharing temporary artifacts with the API.
      - worker-scratch:/tmp
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 2m
    depends_on:
      migrate: {condition: service_completed_successfully}
      mssql-fixture: {condition: service_started}
      s3: {condition: service_started}

  runner:
    <<: *proof_application
    profiles: [proof]
    command: [bun, test, acceptance/mssql-recovery.test.ts]
    environment:
      <<: *proof_environment
      STEELKEEP_ACCEPTANCE: synthetic-remote-mssql
      STEELKEEP_MSSQL_PHYSICAL_X64: ${STEELKEEP_MSSQL_PHYSICAL_X64:?Root must verify a physical Linux x64 host}
      STEELKEEP_MSSQL_ACCEPT_EULA: ${STEELKEEP_MSSQL_ACCEPT_EULA:?Operator must explicitly accept applicable Microsoft terms first}
      STEELKEEP_MSSQL_SA_PASSWORD_FILE: /run/steelkeep/mssql-sa-password
    volumes:
      # Only the explicit proof runner receives SA material and can write its
      # public result. API/worker mounts above never expose this directory.
      - ./.steelkeep/mssql-proof:/run/steelkeep:rw
    mem_limit: 2g
    cpus: 1
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
      mssql-fixture: {condition: service_started}
      s3: {condition: service_started}

networks:
  proof:
    internal: true

# All data and scratch volumes are retained for independent inspection, even
# after failed/partial imports. Never run down -v to repeat this proof.
volumes:
  metadata:
  artifacts:
  sql-data:
  worker-scratch:
