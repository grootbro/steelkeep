name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      drive_ui_only:
        description: Rerun only the isolated Drive UI proof after an already-qualified source change
        type: boolean
        default: false
      release_only:
        description: Build a runtime bundle using a successful unchanged-source UI qualification
        type: boolean
        default: false
      qualified_ui_run:
        description: Successful Drive UI workflow run used by release_only
        type: string
        default: '45209048473'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.drive_ui_only && !inputs.release_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:acceptance
      - run: bun run test
      - run: bun run build

  google-drive:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steelkeep_drive_ci
          POSTGRES_PASSWORD: synthetic-drive-ci-only
          POSTGRES_DB: steelkeep_drive_ci
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U steelkeep_drive_ci -d steelkeep_drive_ci" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://steelkeep_drive_ci:synthetic-drive-ci-only@127.0.0.1:5432/steelkeep_drive_ci
      STEELKEEP_GOOGLE_DRIVE_ACCEPTANCE: synthetic-ci
      STEELKEEP_KEY_FILE: /tmp/steelkeep-drive-ci/key
      STEELKEEP_TOKEN_FILE: /tmp/steelkeep-drive-ci/token
      STEELKEEP_ALLOWED_HOSTS: 127.0.0.1,localhost
      STEELKEEP_ALLOWED_ORIGINS: http://127.0.0.1:4310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Create disposable fixture keys
        run: |
          umask 077
          mkdir -m 700 /tmp/steelkeep-drive-ci
          head -c 32 /dev/urandom > "$STEELKEEP_KEY_FILE"
          openssl rand -hex 32 > "$STEELKEEP_TOKEN_FILE"
      - run: bun server/migrate.ts
      - run: bun test tests/google-drive.integration.test.ts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.drive_ui_only }}
      - run: bun run build
      - name: Install isolated browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Check native Drive interface
        id: drive-ui
        env:
          STEELKEEP_UI_ACCEPTANCE: github-google-drive
        run: node .github/scripts/check-google-drive.cjs
      - name: Package qualified runtime without rebuilding
        env:
          STEELKEEP_UI_ACCEPTANCE: github-google-drive
        run: python3 .github/scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steelkeep-release-${{ github.sha }}
          path: ${{ runner.temp }}/steelkeep-release/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && (steps.drive-ui.outcome == 'success' || steps.drive-ui.outcome == 'failure') }}
        with:
          name: google-drive-ui
          path: output/playwright/google-drive-ui/
          retention-days: 7
          if-no-files-found: warn

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Read successful source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_UI_RUN: ${{ inputs.qualified_ui_run }}
        run: |
          gh run view "$QUALIFIED_UI_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha > "$RUNNER_TEMP/qualified-ui-run.json"
          gh run download "$QUALIFIED_UI_RUN" --repo "$GITHUB_REPOSITORY" --name google-drive-ui --dir output/playwright/google-drive-ui
      - run: bun run build
      - name: Package unchanged qualified runtime
        env:
          STEELKEEP_UI_ACCEPTANCE: github-google-drive
          STEELKEEP_QUALIFIED_UI_RUN_FILE: ${{ runner.temp }}/qualified-ui-run.json
        run: python3 .github/scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steelkeep-release-${{ github.sha }}
          path: ${{ runner.temp }}/steelkeep-release/*
          retention-days: 7
          if-no-files-found: error
