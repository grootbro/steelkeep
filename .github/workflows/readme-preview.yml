name: README preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated browser
        run: |
          command -v npx
          npm install --prefix "$RUNNER_TEMP/readme-browser" --no-audit --no-fund --package-lock=false playwright@1.64.1
          "$RUNNER_TEMP/readme-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect public GitHub README
        env:
          NODE_PATH: ${{ runner.temp }}/readme-browser/node_modules
        run: node .github/scripts/check-readme.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-readme-preview
          path: output/playwright/github-readme/
          retention-days: 7
          if-no-files-found: error
