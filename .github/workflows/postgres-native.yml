name: PostgreSQL native qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: postgres-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres17:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steelkeep_native_ci
          POSTGRES_PASSWORD: synthetic-native-ci-only
          POSTGRES_DB: steelkeep_native_ci
        ports: [55417:5432]
        options: --health-cmd "pg_isready -U steelkeep_native_ci -d steelkeep_native_ci" --health-interval 3s --health-timeout 3s --health-retries 30
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: steelkeep_native_ci
          POSTGRES_PASSWORD: synthetic-native-ci-only
          POSTGRES_DB: steelkeep_native_ci
        ports: [55418:5432]
        options: --health-cmd "pg_isready -U steelkeep_native_ci -d steelkeep_native_ci" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://steelkeep_native_ci:synthetic-native-ci-only@127.0.0.1:55417/steelkeep_native_ci
      STEELKEEP_POSTGRES_ACCEPTANCE: github-native-17-18
      STEELKEEP_ALLOWED_HOSTS: 127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install vendor-authenticated PG17 and PG18 clients
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m0755 /usr/share/keyrings
          curl --fail --silent --show-error --proto '=https' https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/steelkeep-pgdg.asc
          fingerprint=$(gpg --batch --show-keys --with-colons /tmp/steelkeep-pgdg.asc | awk -F: '$1=="fpr" {print $10;exit}')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          while IFS= read -r existing; do sudo mv "$existing" "$existing.steelkeep-ci-disabled"; done < <(rg -l 'apt\.postgresql\.org' /etc/apt/sources.list.d || true)
          sudo install -m0644 /tmp/steelkeep-pgdg.asc /usr/share/keyrings/steelkeep-pgdg.asc
          printf 'deb [arch=amd64 signed-by=/usr/share/keyrings/steelkeep-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main\n' | sudo tee /etc/apt/sources.list.d/steelkeep-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17 postgresql-client-18 util-linux
          python3 scripts/package-postgres18-client.py
          echo "$GITHUB_WORKSPACE/output/postgres-native-ci/postgres18-client/wrappers" >> "$GITHUB_PATH"
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun run typecheck:acceptance
      - run: bun run test
      - name: Actual PG17 and bundled PG18 adapter roundtrips
        run: bun test tests/postgres-native.integration.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-native-${{ github.sha }}
          path: |
            output/postgres-native-ci/*.json
            output/postgres-native-ci/*.tar.gz
          if-no-files-found: error
          retention-days: 14
